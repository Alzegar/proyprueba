<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Portal Académico</title>

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="page">
    <section class="card" aria-labelledby="titulo">
      <header class="card__header">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6l8-3z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </span>
        <p class="eyebrow">PLATAFORMA ACADÉMICA 2026 </p>
        <p class="brand-name">Portal Académico</p>
        <h1 id="titulo">Iniciar sesión</h1>
        <p class="subtitle">Ingresa con tu correo y tu contraseña para continuar.</p>
      </header>

      
      <form id="loginForm" novalidate>

     
        <div class="field">
          <label for="email">Correo electrónico</label>
          <div class="input-wrap">
            <span class="icon" aria-hidden="true">
             
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
              </svg>
            </span>
            
            <input type="email" id="email" name="email" placeholder="nombre@correo.com"
                   autocomplete="email" aria-describedby="email-error" aria-invalid="false">
          </div>
         
          <p class="error" id="email-error" role="alert"></p>
        </div>

      
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <span class="icon" aria-hidden="true">
              
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="5" y="11" width="14" height="10" rx="2"/>
                <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres"
                   autocomplete="current-password" aria-describedby="password-error" aria-invalid="false">
            <button type="button" class="toggle" id="togglePassword"
                    aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="password">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 3l18 18"/>
                <path d="M10.6 6.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1"/>
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
          <p class="error" id="password-error" role="alert"></p>
        </div>
        <div class="options">
          <label class="remember" for="remember">
            <input type="checkbox" id="remember" name="remember">
            <span>Recordar mi correo</span>
          </label>
          <a href="#" id="forgotLink" class="link">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="btn" id="submitBtn">Iniciar sesión</button>
        <div id="formMessage" class="message" role="status" aria-live="polite" hidden></div>
      </form>
      <footer class="card__footer">
        <p>Práctica didáctica de desarrollo web. No uses credenciales reales.</p>
      </footer>
      <p class="footer">© 2027 Portal Académico. PROYECTO DIDACTICO UNIVERSITARIO.</p>
    </section>
  </main>
</body>
</html>
